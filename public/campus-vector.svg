<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" className="w-full h-full block select-none">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F7FA" />
      <stop offset="50%" stop-color="#E9F2F7" />
      <stop offset="100%" stop-color="#DFECF3" />
    </linearGradient>
    
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="skylightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="glassFacade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="brickWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3" />
    </filter>

    <filter id="bldgShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#0B1F33" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Base Terrain with Rounded Isometric Cutout -->
  <path d="M 120 220 L 500 20 L 980 260 L 580 560 L 60 380 Z" fill="url(#groundGrad)" stroke="#CBD5E1" stroke-width="1.5" />
  <path d="M 60 380 L 580 560 L 580 575 L 60 395 Z" fill="#CBD5E1" />
  <path d="M 580 560 L 980 260 L 980 275 L 580 575 Z" fill="#94A3B8" />

</svg>